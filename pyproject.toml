[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collusion-sim"
version = "0.1.0"
description = "SWDA PoC: controlled multi-agent simulation of grant-scheme collusion risk patterns (LangGraph)"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-core>=1.0,<2",
  "pydantic>=2.7,<3",
  "langchain>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
